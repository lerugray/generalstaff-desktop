            conversation.messages.push({ id: `retry-${Date.now()}`, role: 'assistant', text: '', status: 'streaming', attempt: 'retry', createdAt: Date.now() });
            setTimeout(() => window.postMessage({ type: 'conversations', conversations }, '*'), 10);
            setTimeout(() => window.postMessage({ type: 'run-event', conversationId: message.conversationId, event: { type: 'status', text: 'In progress' }, card: { title: message.strategy === 'transcript' ? 'Continued from the written record' : 'Taking the Codex seat', what: message.strategy === 'transcript' ? 'Continued from the written record.' : 'Taking the Codex seat.', where: 'in GeneralStaff', status: 'In progress', tone: 'working' } }, '*'), 25);
          }
        },
      });
    </script>
