[package]
name = "generalstaff-desktop"
version = "0.0.1"
description = "Desktop command console for GeneralStaff"
authors = ["Ray Weiss"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
notify = "8.2.0"
serde_yaml_ng = "0.10.0"
portable-pty = "0.9.0"
base64 = "0.22.1"
libc = "0.2.186"
