<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeneralStaff</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-paper">
    <div id="app">
      <aside id="rail" class="rail">
        <header id="rail-head" class="rail__head" title="Back to the fleet briefing">
          <div class="rail__wordmark">GENERALSTAFF</div>
          <div class="rail__sub">Command Console</div>
        </header>
        <div class="rail__section">Fleet</div>
        <nav id="fleet-list" class="rail__list" aria-label="Fleet"></nav>
        <footer id="rail-foot" class="rail__foot">
          <span id="fleet-status-text">fleet state</span>
          <div id="rail-themes" class="rail__themes" title="Theme" aria-label="Theme"></div>
          <div id="theme-hint" class="rail__hint" hidden>reopen running sessions to apply</div>
        </footer>
      </aside>
      <main id="main">
        <div id="tabbar"></div>
        <section id="content">
          <div id="fleet-view" class="view view-fleet" data-view="fleet"></div>
        </section>
      </main>
    </div>
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/addon-fit.js"></script>
    <script src="app.js"></script>
  </body>
</html>
